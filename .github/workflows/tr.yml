name: 鉄道・駅・バス停のデータを更新
on:
  push:
    branches: [machi]
    paths: ['.github/workflows/tr.yml', 'tools/tr/**']
permissions:
  contents: write
concurrency:
  group: tr-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: machi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 国土数値情報（鉄道・バス停留所）から元データを取る
        run: |
          pip install -q pyshp
          python tools/tr/fetch.py "$RUNNER_TEMP/raw"
      - name: 地図用のデータを作る（tr/）
        if: hashFiles('tools/tr/build.py') != ''
        run: python tools/tr/build.py "$RUNNER_TEMP/raw" tr
      - name: 元データを tr-src ブランチに残す
        if: always()
        run: |
          cd "$RUNNER_TEMP/raw"
          printf '%s\n' "国土数値情報（鉄道データ N02・バス停留所データ P11）（国土交通省）から、地図の範囲に掛かる分を取り出したものです。" "出典：国土数値情報ダウンロードサイト https://nlftp.mlit.go.jp/ksj/" > README.txt
          git init -q -b tr-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "鉄道・駅・バス停の元データ（$(TZ=Asia/Tokyo date +%F)）"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:tr-src
      - name: 変わっていれば反映する
        if: hashFiles('tools/tr/build.py') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tr
          if git diff --cached --quiet; then echo "鉄道・駅・バス停のデータに変更はありません"; exit 0; fi
          git commit -qm "鉄道・駅・バス停のデータを更新"
          for i in 1 2 3 4 5; do
            git fetch -q origin machi
            git rebase -q origin/machi
            printf '{"ref":"%s","date":"%s"}\n' "$(git rev-parse HEAD)" "$(TZ=Asia/Tokyo date +%F)" > manifest.json
            git add manifest.json
            git commit -qm "読み込む版の指定を更新"
            if git push -q origin HEAD:machi; then exit 0; fi
            git reset -q --hard HEAD~1
            sleep 10
          done
          exit 1
