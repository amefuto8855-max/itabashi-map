name: 板橋区Open Photoの形を調べる
on:
  push:
    branches: [machi]
    paths: ['.github/workflows/op.yml', 'tools/op/**']
permissions:
  contents: write
concurrency:
  group: op-data
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: machi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 入口のページを読む
        run: python tools/op/explore.py "$RUNNER_TEMP/op"
      - name: 結果を op-src ブランチに残す
        if: always()
        run: |
          cd "$RUNNER_TEMP/op"
          git init -q -b op-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "板橋区Open Photoのページの形（$(TZ=Asia/Tokyo date +%F)）"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:op-src
